spring.application.name=enterprise-pm-suite

# PostgreSQL (Neon)

spring.datasource.url=jdbc:postgresql://ep-withered-sunset-aq0z70wn-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require

spring.datasource.username=neondb_owner

spring.datasource.password=YOUR_NEW_NEON_PASSWORD

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Server

server.port=8080

# Optional (remove when deploying to Render/Railway)
server.tomcat.basedir=D:/projects/enterprise-temp

# JWT


jwt.secret=mySuperSecretKeyForJwtAuthentication123456789
jwt.expiration=86400000